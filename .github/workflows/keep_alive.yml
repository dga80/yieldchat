name: Keep Render Backend Awake (24/7 Ping)

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from going to sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping YieldChat Backend
        run: |
          echo "Sending keep-alive ping to Render backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://yieldchat-backend.onrender.com/api/status || echo "failed")
          echo "Render HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is active and awake!"
          else
            echo "⚠️ Backend responded with $STATUS (waking up or offline)"
          fi
